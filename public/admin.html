
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4faff">
  <title>لوحة التحكم | Delta Scripts</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">D</span><span>Delta <b>Scripts</b></span></a>
    <div class="top-actions">
      <span class="admin-chip">لوحة الأدمن</span>
      <button class="button button-outline" id="logoutBtn">تسجيل الخروج</button>
    </div>
  </header>

  <main class="admin-main">
    <div class="admin-welcome">
      <div>
        <span class="eyebrow">مركز الإدارة</span>
        <h1>لوحة التحكم</h1>
        <p class="muted">إدارة ومتابعة مكتبة Delta Scripts</p>
      </div>
      <a class="button button-outline" href="/">عرض الموقع</a>
    </div>

    <section class="admin-panel">
      <h2>نظرة عامة</h2>
      <div class="dashboard-stats">
        <div class="stat-card">
          <span>إجمالي السكربتات</span>
          <strong id="statsTotal">...</strong>
        </div>
        <div class="stat-card">
          <span>إجمالي أحرف الأكواد</span>
          <strong id="statsCode">...</strong>
        </div>
        <div class="stat-card">
          <span>آخر سكربت مضاف</span>
          <strong id="statsLatest">...</strong>
        </div>
      </div>
    </section>

    <section class="admin-panel">
      <h2 id="editorTitle">إضافة سكربت جديد</h2>
      <form id="scriptForm" class="script-form">
        <input type="hidden" id="scriptId">
        <label>اسم السكربت
          <input id="scriptName" maxlength="90" required placeholder="مثال: اسم السكربت">
        </label>
        <label>كود السكربت
          <textarea id="scriptCode" required rows="12" maxlength="50000" dir="ltr" spellcheck="false" placeholder="الصق كود السكربت هنا..."></textarea>
        </label>
        <div class="form-actions">
          <button class="button button-primary" type="submit" id="saveBtn">إضافة السكربت</button>
          <button class="button button-soft hidden" type="button" id="cancelEdit">إلغاء التعديل</button>
        </div>
      </form>
    </section>

    <section class="admin-panel">
      <div class="list-heading">
        <div>
          <h2>السكربتات المضافة</h2>
          <p class="muted" id="adminCount">0 سكربت</p>
        </div>
        <input class="admin-search" id="adminSearch" type="search" placeholder="ابحث في السكربتات...">
      </div>
      <div id="adminScripts" class="admin-list">
        <div class="empty-state">جارٍ التحميل...</div>
      </div>
    </section>

    <p class="form-error" id="adminError"></p>
  </main>

  <script src="/admin.js" defer></script>
</body>
</html>
