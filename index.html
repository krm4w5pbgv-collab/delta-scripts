<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08bce9"><title>MOXB | Family</title>
<style>
:root{--cyan:#12bde8;--bg:#050b10;--panel:#101b23;--muted:#a7bac5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#123b50 0,#07121b 44%,#03070b 100%);color:#f4fbff;font-family:Arial,Tahoma,sans-serif;min-height:100vh}.wrap{max-width:1080px;margin:auto;padding:24px}.logo{font-size:clamp(42px,9vw,78px);font-weight:1000;font-style:italic;letter-spacing:-5px;text-align:center;color:white;text-shadow:4px 5px 0 #000,0 0 24px #12bde8}.sub{text-align:center;color:#d6f7ff;margin-top:-5px}.card{max-width:520px;margin:28px auto;background:#0d1821ed;border:1px solid #1a5268;border-radius:22px;padding:24px;box-shadow:0 18px 60px #0009}.wide{max-width:900px}.hidden{display:none!important}h2{text-align:center;margin:5px 0 22px}input,textarea{width:100%;padding:14px;margin:7px 0;border-radius:11px;border:1px solid #29414e;background:#081119;color:white;font-size:16px;outline:none}input:focus,textarea:focus{border-color:var(--cyan)}button{border:0;border-radius:11px;padding:13px 18px;background:var(--cyan);color:#001018;font-weight:bold;font-size:16px;cursor:pointer;margin:5px}button.secondary{background:#203441;color:white}button.danger{background:#8e2634;color:white}.full{width:100%}.muted{color:var(--muted);font-size:13px}.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:18px 0}.tabs button{background:#172b37;color:white}.tabs button.active{background:var(--cyan);color:#001018}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}.msg{min-height:22px;color:#8fe9ff;text-align:center}.item{padding:12px;border:1px solid #27414e;border-radius:12px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}.item span{overflow-wrap:anywhere}.small{font-size:12px}.foot{text-align:center;color:#7893a2;margin:25px}
</style></head><body><div class="wrap">
<header><div class="logo">MOXB</div><div class="sub">Family almuhaish x albosbit</div></header>
<section id="login" class="card"><h2>تسجيل الدخول</h2><input id="username" placeholder="اسم المستخدم" autocomplete="username"><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password"><input id="friendWord" type="password" placeholder="كلمة الأصدقاء"><input id="accessCode" type="password" placeholder="رمز الدخول"><button class="full" onclick="login()">دخول</button><div id="loginMsg" class="msg"></div><p class="muted">الحسابات ينشئها الأونر فقط.</p></section>
<section id="app" class="hidden">
<div class="card wide"><div class="row" style="align-items:center"><div><b id="welcome"></b><div class="muted">مرحباً بك في MOXB</div></div><button class="secondary" onclick="logout()">تسجيل الخروج</button></div>
<div class="tabs"><button class="active" onclick="tab('cipher',this)">الشفرة</button><button onclick="tab('send',this)">إرسال شفرة</button><button id="adminTab" class="hidden" onclick="tab('admin',this)">لوحة الأونر</button></div>
<div id="cipher"><h2>قفل أو فك شفرة</h2><div class="tabs"><button class="active" onclick="mode('lock',this)">قفل شفرة</button><button onclick="mode('unlock',this)">فك شفرة</button></div><input id="cipherKey" type="password" placeholder="كلمة الأصدقاء المشتركة"><textarea id="cipherInput" rows="5" placeholder="اكتب الرسالة أو الشفرة هنا"></textarea><button class="full" onclick="processCipher()">تنفيذ</button><textarea id="cipherOutput" rows="5" readonly placeholder="النتيجة تظهر هنا"></textarea><button class="secondary" onclick="copy('cipherOutput')">نسخ النتيجة</button><div id="cipherMsg" class="msg"></div></div>
<div id="send" class="hidden"><h2>إرسال شفرة</h2><p class="muted">اكتب رسالتك، ثم شفّرها بكلمة الأصدقاء وأرسل النص الناتج للطرف الآخر.</p><input id="sendKey" type="password" placeholder="كلمة الأصدقاء المشتركة"><textarea id="sendText" rows="5" placeholder="اكتب رسالتك"></textarea><button class="full" onclick="encryptSend()">تشفير الرسالة</button><textarea id="sendOutput" rows="5" readonly placeholder="الشفرة الجاهزة للإرسال"></textarea><button class="secondary" onclick="copy('sendOutput')">نسخ الشفرة</button><div id="sendMsg" class="msg"></div></div>
<div id="admin" class="hidden"><h2>لوحة تحكم الأونر</h2><div class="row"><input id="newUser" placeholder="اسم المستخدم"><input id="newPass" type="password" placeholder="كلمة المرور (8 أحرف فأكثر)"></div><div class="row"><input id="newFriend" type="password" placeholder="كلمة الأصدقاء"><input id="newCode" type="password" placeholder="رمز الدخول"></div><button onclick="createUser()">إنشاء حساب</button><div id="adminMsg" class="msg"></div><h3>الحسابات</h3><div id="users"></div></div>
</div></section><div class="foot">MOXB • Family almuhaish x albosbit</div></div>
<script>
let currentMode='lock';
async function api(url,opts={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'حدث خطأ');return d}
function show(id){document.getElementById(id).classList.remove('hidden')}
function hide(id){document.getElementById(id).classList.add('hidden')}
async function login(){let msg=document.getElementById('loginMsg');msg.textContent='';try{let d=await api('/api/login',{method:'POST',body:JSON.stringify({username:username.value,password:password.value,friendWord:friendWord.value,accessCode:accessCode.value})});hide('login');show('app');welcome.textContent='مرحباً، '+d.user.username;if(d.user.isAdmin){show('adminTab');loadUsers()}}catch(e){msg.textContent=e.message}}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
function tab(id,b){['cipher','send','admin'].forEach(hide);show(id);document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function mode(m,b){currentMode=m;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');cipherInput.placeholder=m==='lock'?'اكتب الرسالة العادية':'الصق الشفرة هنا'}
async function deriveKey(pass,salt){let enc=new TextEncoder();let base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));const un64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function encryptText(text,key){let salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await deriveKey(key,salt);let data=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(text));return 'MOXB1.'+[b64(salt),b64(iv),b64(data)].join('.')}
async function decryptText(text,key){let p=text.split('.');if(p.length!==4||p[0]!=='MOXB1')throw Error('صيغة الشفرة غير صحيحة');let salt=un64(p[1]),iv=un64(p[2]),data=un64(p[3]),k=await deriveKey(key,salt);let out=await crypto.subtle.decrypt({name:'AES-GCM',iv},k,data);return new TextDecoder().decode(out)}
async function processCipher(){let m=document.getElementById('cipherMsg');try{cipherOutput.value=currentMode==='lock'?await encryptText(cipherInput.value,cipherKey.value):await decryptText(cipherInput.value,cipherKey.value);m.textContent='تمت العملية'}catch(e){m.textContent='تعذر التنفيذ: تأكد من النص وكلمة الأصدقاء'}}
async function encryptSend(){try{sendOutput.value=await encryptText(sendText.value,sendKey.value);sendMsg.textContent='تم التشفير. انسخ الشفرة وأرسلها.'}catch(e){sendMsg.textContent='أدخل الرسالة وكلمة الأصدقاء'}}
async function copy(id){let el=document.getElementById(id);await navigator.clipboard.writeText(el.value);let m=document.getElementById(id==='sendOutput'?'sendMsg':'cipherMsg');m.textContent='تم النسخ'}
async function createUser(){try{await api('/api/users',{method:'POST',body:JSON.stringify({username:newUser.value,password:newPass.value,friendWord:newFriend.value,accessCode:newCode.value})});adminMsg.textContent='تم إنشاء الحساب';newUser.value=newPass.value=newFriend.value=newCode.value='';loadUsers()}catch(e){adminMsg.textContent=e.message}}
async function loadUsers(){try{let d=await api('/api/users');users.innerHTML=d.users.map(u=>`<div class="item"><span>${esc(u.username)} ${u.is_admin?'(أونر)':''}</span>${u.is_admin?'':`<button class="danger small" onclick="deleteUser(${u.id})">حذف</button>`}</div>`).join('')}catch(e){adminMsg.textContent=e.message}}
async function deleteUser(id){if(!confirm('تأكيد حذف الحساب؟'))return;try{await api('/api/users/'+id,{method:'DELETE'});loadUsers()}catch(e){adminMsg.textContent=e.message}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
